name: Release
on:
  push:
    branches: ['**']
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            vsce_target: win32-x64
            artifact: dispatch-win32-x64.vsix
          - os: ubuntu-latest
            vsce_target: linux-x64
            artifact: dispatch-linux-x64.vsix

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npx tsc --noEmit

      - run: npx eslint src/

      - run: npm run test:unit

      - name: Package VSIX (${{ matrix.vsce_target }})
        run: npx vsce package --target ${{ matrix.vsce_target }} --out ${{ matrix.artifact }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compute release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            SAFE_BRANCH="${BRANCH//\//-}"
            SHORT_SHA="${GITHUB_SHA::7}"
            echo "tag=branch-${SAFE_BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows VSIX
        uses: actions/download-artifact@v4
        with:
          name: dispatch-win32-x64.vsix

      - name: Download Linux VSIX
        uses: actions/download-artifact@v4
        with:
          name: dispatch-linux-x64.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dispatch-win32-x64.vsix
            dispatch-linux-x64.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
