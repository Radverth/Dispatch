name: CI & Release
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npx tsc --noEmit

      - run: npx eslint src/

      - run: npm run test:unit

      - run: npm run compile

      - name: Package Windows VSIX
        run: npx vsce package --target win32-x64 --out dispatch-win32-x64.vsix

      - name: Package Linux VSIX
        run: npx vsce package --target linux-x64 --out dispatch-linux-x64.vsix

      - name: Compute next version
        if: github.event_name == 'push'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
            NEXT="1.0.0"
          else
            LATEST="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            PATCH=$(( PATCH + 1 ))
            NEXT="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${NEXT}"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          name: ${{ steps.version.outputs.next }}
          generate_release_notes: true
          files: |
            dispatch-win32-x64.vsix
            dispatch-linux-x64.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
