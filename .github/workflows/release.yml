name: Release
on:
  push:
    branches: ['**']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            vsce_target: win32-x64
            artifact: dispatch-win32-x64.vsix
          - os: ubuntu-latest
            vsce_target: linux-x64
            artifact: dispatch-linux-x64.vsix

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npx tsc --noEmit

      - run: npx eslint src/

      - run: npm run test:unit

      - name: Package VSIX (${{ matrix.vsce_target }})
        run: npx vsce package --target ${{ matrix.vsce_target }} --out ${{ matrix.artifact }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Fetch the latest release tag; default to 1.0.0 if none exists
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
            NEXT="1.0.0"
          else
            # Strip leading 'v' if present
            LATEST="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            PATCH=$(( PATCH + 1 ))
            NEXT="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${NEXT}"

      - name: Download Windows VSIX
        uses: actions/download-artifact@v4
        with:
          name: dispatch-win32-x64.vsix

      - name: Download Linux VSIX
        uses: actions/download-artifact@v4
        with:
          name: dispatch-linux-x64.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          name: ${{ steps.version.outputs.next }}
          generate_release_notes: true
          files: |
            dispatch-win32-x64.vsix
            dispatch-linux-x64.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
